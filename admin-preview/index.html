<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>管理画面サンプル｜じねんネットワーク</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#203448;font:17px/1.7 system-ui,-apple-system,"Noto Sans JP",sans-serif}aside{position:fixed;inset:0 auto 0 0;width:245px;background:#142d3e;color:white;padding:34px 20px;overflow:auto}.brand{font-size:27px;letter-spacing:.12em;line-height:1.7}aside p{color:#b9ccda;font-size:14px}nav{display:grid;gap:7px;margin-top:30px}nav a{color:#e5edf3;text-decoration:none;padding:12px 14px;border-radius:6px;font-size:16px}nav a[aria-current]{background:#314b5d;border-left:3px solid #d4b679;color:white}nav a:hover{background:#294657}.workspace{margin-left:245px}header{background:white;border-bottom:1px solid #dce2e7;padding:23px 35px;display:flex;justify-content:space-between;gap:15px}header span{font-size:14px;color:#6b7784}main{padding:32px;max-width:1500px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:center;gap:20px}.heading p{color:#687d8c}.eyebrow{font-size:12px;letter-spacing:.2em;color:#9a743c!important;margin:0}h1{font-size:30px;margin:4px 0 25px}h2{font-size:21px;margin:0 0 18px}.panel{padding:25px;background:white;border:1px solid #d9e1e7;border-radius:10px;margin:0 0 24px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}label{display:grid;font-size:15px;gap:7px}input,select{width:100%;font:inherit;font-size:17px;padding:11px;border:1px solid #b6c4d0;border-radius:5px;background:white;color:#203448;min-height:47px}button{background:#16374c;color:white;border:0;padding:13px 35px;border-radius:6px;font:inherit;cursor:pointer}a{color:#225b7b;text-underline-offset:4px}.actions{display:flex;align-items:center;gap:25px;margin-top:22px}summary{cursor:pointer;margin:18px 0;color:#31566d}.table-wrap{padding:0;overflow:auto}table{border-collapse:collapse;width:100%;min-width:620px;text-align:left}th{background:#eaf0f4;padding:17px 20px;font-size:14px;white-space:nowrap}td{padding:19px 20px;border-top:1px solid #e4e9ed;vertical-align:top}td:first-child{font-weight:600}td a{display:inline-block;padding:2px 0}.badge{display:inline-block;background:#eaf1f4;color:#34566a;border-radius:4px;font-size:13px;padding:3px 9px;white-space:nowrap}.excerpt{font-size:14px;color:#6b7f8e;max-width:450px;font-weight:400;white-space:pre-wrap}.count{font-size:15px;color:#677b8a}.pager{display:flex;justify-content:space-between;gap:25px}.pager a{padding:12px;background:white;border:1px solid #c8d5de;border-radius:6px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:24px}dl{display:grid;grid-template-columns:150px 1fr;gap:10px;margin:0}dt{color:#687d8c}dd{margin:0;overflow-wrap:anywhere}footer{padding:20px 32px;color:#6e7f8a;font-size:14px}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible,select:focus-visible{outline:3px solid #b18a43;outline-offset:3px}@media(max-width:850px){aside{position:static;width:100%;padding:18px 20px}.brand{font-size:20px}.brand br{display:none}aside p{margin:3px 0}nav{display:flex;overflow:auto;margin-top:12px;gap:4px}nav a{white-space:nowrap}.workspace{margin:0}header{padding:15px 20px}main{padding:22px 16px}.heading{display:block}.heading p{margin:0 0 16px}h1{font-size:26px}.cards{grid-template-columns:1fr;gap:0}.panel{padding:18px}.table-wrap{padding:0}dl{grid-template-columns:1fr;gap:2px}dd{margin-bottom:10px}header span{display:none}} .notice{background:#fff6e5;color:#745720;padding:10px 24px;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stats .panel{padding:18px 24px}.stats strong{font-size:30px;display:block}.stats small{color:#687d8c}dialog{border:1px solid #c8d5de;border-radius:12px;max-width:700px;width:92%;padding:30px;color:#203448;max-height:85vh;overflow:auto}dialog::backdrop{background:#10233399}.close{float:right;padding:7px 15px;background:#edf2f5;color:#203448}nav button{text-align:left;background:transparent;font-size:16px;padding:12px 14px;color:#e5edf3}nav button[aria-current]{background:#314b5d;border-left:3px solid #d4b679}td button{padding:0;background:transparent;color:#225b7b;text-decoration:underline;font-size:16px}#new{white-space:nowrap}.status{padding:3px 10px;border-radius:5px;background:#e7f2ed;font-size:13px}.muted{color:#687d8c;font-size:14px}@media(max-width:600px){.stats{gap:7px}.stats .panel{padding:13px}.stats strong{font-size:24px}.heading{display:block}nav button{white-space:nowrap}}</style></head><body><aside><div class="brand">じねん<br>ネットワーク</div><p>運営管理</p><nav id="nav" aria-label="管理メニュー"></nav></aside><div class="workspace"><header><strong>じねんネットワーク ／ 管理画面</strong><span>画面確認用</span></header><div class="notice">サンプル画面です。表示はすべて仮データです。登録・変更・メール送信は行いません。</div><main><div class="heading"><div><p class="eyebrow">MANAGEMENT</p><h1 id="title">会員管理</h1></div><button id="new">＋ 新しく登録</button></div><div class="stats"><div class="panel"><small id="stat-label">登録会員</small><strong id="stat">6<span class="muted">人</span></strong></div><div class="panel"><small>承認待ち</small><strong>2<span class="muted">人</span></strong></div><div class="panel"><small>メール送信失敗</small><strong>1<span class="muted">件</span></strong></div></div><form id="search" class="panel"><div class="fields"><label id="qlabel">名前・メール・キーワード<input id="q" placeholder="一部の文字でも検索できます"></label><label>地区<select id="area"><option value="">すべての地区</option><option>福岡</option><option>東京</option><option>北海道</option></select></label><label>状態<select id="state"><option value="">すべて</option></select></label></div><details><summary>詳しく絞り込む</summary><div class="fields"><label>開始日<input type="date" id="from"></label><label>終了日<input type="date" id="to"></label></div></details><div class="actions"><button>この条件で検索</button><button type="reset" class="close">条件をクリア</button></div></form><p class="count" id="count" aria-live="polite"></p><div class="panel table-wrap"><table><thead id="thead"></thead><tbody id="rows"></tbody></table></div><p class="muted">名前やタイトルを押すと、詳細画面の見本が開きます。</p></main><footer>管理画面の構成・見やすさを確認するための独立したサンプルです。</footer></div><dialog id="detail"><button type="button" class="close" id="close">閉じる ×</button><div id="detailbody"></div></dialog><script>
const sections={members:{title:'会員管理',action:'＋ 会員を登録',heads:['会員名','メールアドレス','地区','会員区分','状態'],rows:[['会員サンプル A','sample-a@example.com','福岡','通常会員','利用中','2026-09-01'],['会員サンプル B','sample-b@example.com','東京','無料会員','利用中','2026-09-03'],['会員サンプル C','sample-c@example.com','北海道','理事','利用中','2026-08-10'],['会員サンプル D','sample-d@example.com','福岡','理事候補','承認待ち','2026-09-10'],['会員サンプル E','sample-e@example.com','東京','通常会員','停止中','2026-07-20'],['会員サンプル F','sample-f@example.com','北海道','無料会員','承認待ち','2026-09-11']]},learning:{title:'学習状況',action:'コース案内の見本',heads:['会員名','カリキュラム','地区','進み具合','状態'],rows:[['会員サンプル A','人間やりなおし・入門','福岡','4 / 6','学習中','2026-09-10'],['会員サンプル B','人間やりなおし・入門','東京','0 / 6','未開始','2026-09-11'],['会員サンプル C','人間やりなおし・入門','北海道','6 / 6','完了','2026-09-09']]},events:{title:'Zoom・月例会',action:'＋ 開催案内を作成',heads:['会議名','開催日','地区','対象','状態'],rows:[['月例会（サンプル）','2026-09-20 13:00','全地区','理事・理事候補','公開済み','2026-09-20'],['福岡の学びの会（サンプル）','2026-09-25 19:00','福岡','全会員','下書き','2026-09-25']]},minutes:{title:'議事録',action:'＋ 議事録を作成',heads:['タイトル','開催日','地区','対象','状態'],rows:[['8月の月例会（サンプル）','2026-08-23','全地区','理事・理事候補','公開済み','2026-08-23'],['9月の月例会（サンプル）','2026-09-20','全地区','理事・理事候補','下書き','2026-09-20']]},redo:{title:'REDO MAIL',action:'＋ 新しい号を作成',heads:['タイトル','発行日','地区','対象','状態'],rows:[['REDO MAIL 第○号（サンプル）','2026-08-10','全地区','やりなおし会員','配信済み','2026-08-10'],['次号（サンプル）','2026-09-10','全地区','やりなおし会員','下書き','2026-09-10']]},prayer:{title:'祈りの蓄積',action:'入力案内メールの見本',heads:['会員名','対象月','地区','参加番号','状態'],rows:[['会員サンプル A','2026年8月','福岡','001','提出済み','2026-08-31'],['会員サンプル B','2026年8月','東京','002','未提出','2026-08-31'],['会員サンプル C','2026年8月','北海道','003','提出済み','2026-08-31']]},mail:{title:'メール配信',action:'＋ メールを作成',heads:['件名','配信日','地区','対象','状態'],rows:[['月例会のご案内（サンプル）','2026-09-12','全地区','理事・理事候補','配信済み','2026-09-12'],['祈りの入力案内（サンプル）','2026-09-01','全地区','参加者','送信失敗あり','2026-09-01']]}};
let current='members';const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
for(const [key,s]of Object.entries(sections)){const b=document.createElement('button');b.textContent=s.title;b.dataset.key=key;b.onclick=()=>{location.hash=key;};$('nav').append(b);}
function choose(){current=location.hash.slice(1);if(!sections[current])current='members';const s=sections[current];$('search').reset();$('state').innerHTML='<option value="">すべて</option>'+[...new Set(s.rows.map(r=>r[4]))].map(x=>'<option>'+esc(x)+'</option>').join('');$('title').textContent=s.title;$('new').textContent=s.action;document.querySelectorAll('nav button').forEach(b=>{b.removeAttribute('aria-current');if(b.dataset.key===current)b.setAttribute('aria-current','page')});$('stat-label').textContent=current==='members'?'登録会員':'登録データ';$('stat').textContent=s.rows.length+(current==='members'?'人':'件');render();}
function render(){const s=sections[current],q=$('q').value.toLowerCase().trim(),area=$('area').value,state=$('state').value,from=$('from').value,to=$('to').value;const rows=s.rows.filter(r=>r.join(' ').toLowerCase().includes(q)&&(!area||r[2]===area)&&(!state||r[4]===state)&&(!from||r[5]>=from)&&(!to||r[5]<=to));$('count').textContent=rows.length+'件を表示 ／ 仮データ';$('thead').innerHTML='<tr>'+s.heads.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr>';$('rows').innerHTML='';for(const r of rows){const tr=document.createElement('tr');tr.innerHTML='<td><button type="button">'+esc(r[0])+'</button></td>'+r.slice(1,5).map((x,i)=>'<td>'+(i===3?'<span class="status">'+esc(x)+'</span>':esc(x))+'</td>').join('');tr.querySelector('button').onclick=()=>openDetail(r);$('rows').append(tr);}if(!rows.length)$('rows').innerHTML='<tr><td colspan="5">該当するデータはありません。条件を減らしてお試しください。</td></tr>';}
function openDetail(r){let body='<h2>'+esc(r[0])+'</h2><p class="muted">詳細画面の見本です。</p><dl>'+sections[current].heads.map((x,i)=>'<dt>'+esc(x)+'</dt><dd>'+esc(r[i])+'</dd>').join('')+'</dl>';if(current==='members'||current==='learning'){body+='<hr><h2>学習状況</h2><p>人間やりなおし・入門 ／ 4 / 6 レッスン（見本）</p><p>✓ レッスン1　✓ レッスン2　✓ レッスン3　✓ レッスン4</p><p>未チェック：レッスン5・6</p><h2>参加状況</h2><p>祈りの蓄積：8月分 提出済み（見本）</p><p>本人のメモは管理画面に表示しません。</p>';}else{body+='<hr><h2>内容</h2><p>ここに案内・議事録などの本文と、公開範囲や配信結果を分かりやすく表示します。</p>';}$('detailbody').innerHTML=body;$('detail').showModal();}
$('new').onclick=()=>{$('detailbody').innerHTML='<h2>'+esc(sections[current].action.replace('＋ ',''))+'</h2><p>作成画面の配置イメージです。入力した内容は保存・送信されません。</p><label>タイトル<input placeholder="タイトルを入力"></label><label>本文<textarea rows="5" style="font:inherit;width:100%;margin:10px 0;padding:10px"></textarea></label><button type="button" id="preview-action">確認画面の見本を見る</button>';$('detail').showModal();$('preview-action').onclick=()=>{$('detailbody').innerHTML='<h2>確認画面（サンプル）</h2><p>本番では、ここで内容・対象者・人数を確認してから保存や配信を行う予定です。</p><p>このサンプルでは何も保存・送信していません。</p>';};};$('close').onclick=()=>$('detail').close();$('search').onsubmit=e=>{e.preventDefault();render()};$('search').onreset=()=>setTimeout(render,0);addEventListener('hashchange',choose);choose();
</script></body></html>
